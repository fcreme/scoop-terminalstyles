name: Bump to latest release

# Daily: point the manifest at TerminalStyles' latest GitHub Release, then run
# the install test against the pushed commit. A push made with GITHUB_TOKEN
# does not start other workflows, so the test is called from here.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=bucket/terminalstyles.json
          tag=$(gh api repos/fcreme/TerminalStyles/releases/latest -q .tag_name)
          ver=${tag#v}
          cur=$(jq -r .version "$f")
          if [ "$ver" = "$cur" ]; then
            echo "Already at $cur"; echo changed=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          zip="TerminalStyles-$ver.zip"
          url="https://github.com/fcreme/TerminalStyles/releases/download/$tag/$zip"
          if ! curl -fsSL -o "$RUNNER_TEMP/$zip" "$url"; then
            echo "::warning::$tag has no $zip asset yet; see RELEASING.md step 8"
            echo changed=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(sha256sum "$RUNNER_TEMP/$zip" | cut -d' ' -f1)
          jq --indent 4 --arg v "$ver" --arg u "$url" --arg h "$sha" \
            '.version = $v | .url = $u | .hash = $h' "$f" > "$f.new" && mv "$f.new" "$f"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "terminalstyles: Update to version $ver"
          git push
          echo changed=true >> "$GITHUB_OUTPUT"

  test:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: main
